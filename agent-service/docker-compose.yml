services:
  agent-service:
    build: .
    container_name: agent-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    extra_hosts:
      # Allows container to reach Ollama running on the host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
